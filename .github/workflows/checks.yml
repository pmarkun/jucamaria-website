name: Validate local site

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build without network access
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: "--require=./scripts/no-network.cjs"
        run: npm run build
